services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-payments}
      POSTGRES_USER: ${POSTGRES_USER:-demo}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    secrets:
      - postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.14.1
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  api:
    build: .
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-payments}
      POSTGRES_USER: ${POSTGRES_USER:-demo}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      QDRANT_URL: http://qdrant:6333
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-simulation}
      STRIPE_SECRET_KEY_FILE: /run/secrets/stripe_secret_key
      STRIPE_WEBHOOK_SECRET_FILE: /run/secrets/stripe_webhook_secret
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    secrets:
      - jwt_secret
      - stripe_secret_key
      - stripe_webhook_secret
      - postgres_password
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started

  outbox-sink:
    build: .
    command: ["python", "-m", "app.safety.sink"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-payments}
      POSTGRES_USER: ${POSTGRES_USER:-demo}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-simulation}
      STRIPE_SECRET_KEY_FILE: /run/secrets/stripe_secret_key
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SINK_METRICS_PORT: 9100
    secrets:
      - stripe_secret_key
      - postgres_password
    ports:
      - "127.0.0.1:${SINK_METRICS_PORT:-9100}:9100"
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy

volumes:
  postgres_data:
  qdrant_data:

secrets:
  postgres_password:
    file: ./.secrets/postgres_password
  jwt_secret:
    file: ./.secrets/jwt_secret
  stripe_secret_key:
    file: ./.secrets/stripe_secret_key
  stripe_webhook_secret:
    file: ./.secrets/stripe_webhook_secret
